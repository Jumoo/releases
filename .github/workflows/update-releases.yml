name: Update releases feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
        run: npm run fetch

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases.json docs/feed.xml docs/compatibility.json
          git diff --cached --quiet || git commit -m "Update releases feed"
          git push
